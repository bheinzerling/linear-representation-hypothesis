[project]
name = "lrh-property-experiments"
version = "0.1.0"
description = "Number-property intervention reproduction code"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "baukit",
    "dataclasses-json>=0.6.7",
    "numpy",
    "peft>=0.18.0",
    "plotly>=6.8.0",
    "pytest>=9.0.2",
    "pytorch-lightning",
    "pyyaml",
    "simple-parsing",
    "torch",
    "tqdm",
    "transformers",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
baukit = { git = "https://github.com/davidbau/baukit" }

[dependency-groups]
dev = [
    "ruff>=0.15.18",
]

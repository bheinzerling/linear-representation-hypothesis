[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lrh-numerical-experiments"
version = "0.1.0"
description = "Numerical probing and intervention reproduction code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "accelerate",
  "bokeh>=3.9.0",
  "datasets>=5.0.0",
  "datashader>=0.19.0",
  "holoviews>=1.22.1",
  "huggingface-hub>=1.10.1",
  "igraph>=1.0.0",
  "kernels>=0.12.0",
  "matplotlib",
  "networkx>=3.6.1",
  "numpy>=1.26.4,<2",
  "pandas",
  "pillow>=12.2.0",
  "plotly",
  "pyarrow>=24.0.0",
  "pytest",
  "pyyaml",
  "safetensors",
  "scikit-learn",
  "scipy",
  "sentencepiece",
  "tokenizers",
  "torch",
  "tqdm",
  "transformers",
]

[project.optional-dependencies]
viz = ["seaborn"]
extras = ["einops"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
